name: Build & Release Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          APP_VERSION=$(python -c "from src.version import __version__; print(__version__)")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "tag_name=v$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --name="KomaShift_v${APP_VERSION}" \
            --windowed \
            --onedir \
            --icon="assets/icon.ico" \
            --add-data="assets/icon.ico;assets" \
            --add-data="assets/icon.png;assets" \
            --add-data="assets/fonts;assets/fonts" \
            --add-data="assets/checkbox_checked.png;assets" \
            --add-data="assets/checkbox_checked_disabled.png;assets" \
            --collect-all=onnxruntime \
            --collect-all=manga_ocr \
            --collect-all=unidic_lite \
            --collect-all=pyphen \
            --copy-metadata=transformers \
            --copy-metadata=tokenizers \
            --copy-metadata=huggingface_hub \
            --exclude-module=botocore \
            --exclude-module=boto3 \
            --exclude-module=Pythonwin \
            --exclude-module=win32ui \
            --exclude-module=PyQt6.QtPdf \
            --exclude-module=PyQt6.QtQml \
            --exclude-module=PyQt6.QtQuick \
            --exclude-module=PyQt6.QtSql \
            --exclude-module=PyQt6.QtTest \
            src/main.py

      - name: Prune Deadweight Assets
        shell: bash
        run: |
          python -c '
          from pathlib import Path
          import os, shutil
          app_ver = os.environ.get("APP_VERSION", "")
          internal = Path("dist") / f"KomaShift_v{app_ver}" / "_internal"
          if internal.exists():
              patterns = [
                  "cv2/opencv_videoio_ffmpeg*.dll",
                  "PyQt6/Qt6/bin/opengl32sw.dll",
                  "PyQt6/Qt6/bin/Qt6Pdf.dll",
                  "PyQt6/Qt6/translations",
                  "Pythonwin",
              ]
              pruned_total = 0
              for pat in patterns:
                  for m in internal.glob(pat):
                      if m.is_file():
                          size = m.stat().st_size
                          m.unlink()
                          pruned_total += size
                          print(f"Pruned file: {m.name} ({size / (1024*1024):.1f} MB)")
                      elif m.is_dir():
                          size = sum(f.stat().st_size for f in m.rglob("*") if f.is_file())
                          shutil.rmtree(m)
                          pruned_total += size
                          print(f"Pruned dir: {m.name} ({size / (1024*1024):.1f} MB)")
              print(f"Total deadweight pruned: {pruned_total / (1024*1024):.1f} MB")
          '

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: installer/komashift_setup.iss
          options: /DMyAppVersion=${{ env.APP_VERSION }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KomaShift-Windows
          path: dist/*.exe

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          files: dist/*.exe
          generate_release_notes: true
