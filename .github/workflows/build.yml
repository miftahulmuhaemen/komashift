name: Build & Release Windows App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          APP_VERSION=$(python -c "from src.version import __version__; print(__version__)")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "tag_name=v$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --name="FolderImagePreviewer_v${APP_VERSION}" \
            --windowed \
            --onefile \
            --icon="assets/icon.ico" \
            --add-data="assets;assets" \
            src/main.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolderImagePreviewer-Windows
          path: dist/*.exe

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          files: dist/*.exe
          generate_release_notes: true
